server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # MkDocs uses directory URLs (/PLATFORM_OVERVIEW/ -> /PLATFORM_OVERVIEW/index.html).
    # try_files resolves those and redirects the no-trailing-slash form.
    location / {
        try_files $uri $uri/ =404;
    }

    # Serve the MkDocs 404 page for unknown paths.
    error_page 404 /404.html;

    # Compress text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
